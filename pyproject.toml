[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "orbital-mechanics-engine"
version = "2.0.0-dev"
requires-python = ">=3.10"
description = "High-performance orbital mechanics simulator with Python bindings"
dependencies = ["numpy>=1.20"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
install.components = ["python"]
